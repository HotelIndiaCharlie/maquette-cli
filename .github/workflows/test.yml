# Every push and pull request: typecheck, the unit tests and the smoke run, on Linux and macOS.
# None of them needs a key, DesignCraft or the network; `npm test` does, so it stays local.
name: Unit tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run smoke
      # dist/ is committed so installing from GitHub needs no build; it must match src/.
      - name: dist/ matches src/
        if: runner.os == 'Linux'
        run: |
          npm run build
          git diff --exit-code --stat -- dist || { echo "::error::dist/ is out of date: run npm run build and commit dist/"; exit 1; }
